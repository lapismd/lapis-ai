[workspace]
members = [
  "crates/lapis-acp-protocol",
  "crates/lapis-acp-agent",
  "crates/lapis-acp-runner",
  "crates/lapis-acp-control",
  "crates/lapis-acp-cli",
  "crates/lapis-acp-testkit",
  "crates/lapis-agent",
  "crates/lapis-agent-tools",
  "crates/lapis-compute",
  "crates/lapis-ai-config",
  "crates/lapis-ai-runtime"
]
resolver = "2"

  [workspace.package]
  version = "0.1.1"
  edition = "2024"
  rust-version = "1.99.0"
  license = "Apache-2.0"
  authors = [ "LapisMD contributors" ]
  publish = [ "crates-io" ]
  repository = "https://github.com/lapismd/lapis-ai"
  homepage = "https://github.com/lapismd/lapis-ai"

  [workspace.dependencies]
  serde_json = "1"
  thiserror = "2"

    [workspace.dependencies.lapis-acp-protocol]
    path = "crates/lapis-acp-protocol"
    version = "0.1.1"

    [workspace.dependencies.lapis-acp-agent]
    path = "crates/lapis-acp-agent"
    version = "0.1.1"

    [workspace.dependencies.lapis-acp-runner]
    path = "crates/lapis-acp-runner"
    version = "0.1.1"

    [workspace.dependencies.lapis-acp-control]
    path = "crates/lapis-acp-control"
    version = "0.1.1"

    [workspace.dependencies.lapis-acp-testkit]
    path = "crates/lapis-acp-testkit"
    version = "0.1.1"

    [workspace.dependencies.lapis-ai-config]
    path = "crates/lapis-ai-config"
    version = "0.1.1"

    [workspace.dependencies.serde]
    version = "1"
    features = [ "derive" ]

    [workspace.dependencies.tokio]
    version = "1"
    features = [
  "fs",
  "io-std",
  "io-util",
  "macros",
  "process",
  "rt",
  "rt-multi-thread",
  "signal",
  "sync",
  "time"
]

[profile.dev]
debug = 0

[profile.dev.package.sha2]
opt-level = 3

[profile.test]
debug = 0
