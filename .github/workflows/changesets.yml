name: Changesets release orchestration
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: changesets-release
  cancel-in-progress: false
env:
  LAPIS_AI_VALIDATION_RUNTIME: native
jobs:
  version:
    if: github.repository == 'lapismd/lapis-ai' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: write
    outputs:
      candidate: ${{ steps.plan.outputs.candidate || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: "1.99.0"
      - run: pnpm install --frozen-lockfile --ignore-pnpmfile
      - run: pnpm check:dependency-intake
      - run: pnpm release:check
      - name: Bootstrap locked Cargo dependencies before version preparation
        run: pnpm dev:cargo -- fetch --locked
      - name: Guard the qualified source-owned version runtime
        id: runtime
        uses: lapismd/lapis-ci/actions/guard-version-runtime@dc81ff65ba812bf005fb2a806eb3308bb8b5f71f
        with:
          qualification-file: .github/version-runtime-qualification.json
          detect-release-intent: true
      - name: Mint repository-scoped version PR token
        if: steps.runtime.outputs.hasChangesets == 'true'
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.LAPIS_DEPENDENCY_APP_CLIENT_ID }}
          private-key: ${{ secrets.LAPIS_DEPENDENCY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - uses: changesets/action@63a615b9cd06ba9a3e6d13796c7fbcb080a60a0b # v1.8.0
        id: changesets
        if: steps.runtime.outputs.hasChangesets == 'true'
        with:
          version: pnpm release:version
          commit: Version coordinated Cargo packages
          title: Version Packages
          commitMode: github-api
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
      - name: Start required checks on bot version PR
        if: steps.changesets.outputs.pullRequestNumber != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION_PR: ${{ steps.changesets.outputs.pullRequestNumber }}
        run: node scripts/release-orchestration.mjs checks
      - name: Plan a new immutable version tag
        id: plan
        if: steps.changesets.outputs.hasChangesets != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release-orchestration.mjs plan
  qualify:
    name: Await exact-source CI
    needs: version
    if: needs.version.outputs.candidate == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-pnpmfile
      - name: Reuse or dispatch exact-source CI for the candidate SHA
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release-orchestration.mjs await-ci
  tag:
    needs: [version, qualify]
    if: needs.version.outputs.candidate == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-pnpmfile
      - name: Create immutable tag and dispatch Cargo release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release-orchestration.mjs tag
