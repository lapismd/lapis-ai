name: Changesets release orchestration
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: changesets-release
  cancel-in-progress: false
env:
  LAPIS_AI_VALIDATION_RUNTIME: native
jobs:
  version:
    if: github.repository == 'lapismd/lapis-ai' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: write
    outputs:
      candidate: ${{ steps.plan.outputs.candidate || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: "1.99.0"
      - run: pnpm install --frozen-lockfile --ignore-pnpmfile
      - run: pnpm release:check
      - name: Bootstrap locked Cargo dependencies before version preparation
        run: pnpm dev:cargo -- fetch --locked
      - uses: changesets/action@63a615b9cd06ba9a3e6d13796c7fbcb080a60a0b # v1.8.0
        id: changesets
        with:
          version: pnpm release:version
          commit: Version coordinated Cargo packages
          title: Version Packages
          commitMode: github-api
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Start required checks on bot version PR
        if: steps.changesets.outputs.pullRequestNumber != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION_PR: ${{ steps.changesets.outputs.pullRequestNumber }}
        run: node scripts/release-orchestration.mjs checks
      - name: Plan a new immutable version tag
        id: plan
        if: steps.changesets.outputs.hasChangesets != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release-orchestration.mjs plan
  qualify:
    needs: version
    if: needs.version.outputs.candidate == 'true'
    permissions:
      contents: read
      pull-requests: read
      actions: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.sha }}
  tag:
    needs: [version, qualify]
    if: needs.version.outputs.candidate == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-pnpmfile
      - name: Create immutable tag and dispatch Cargo release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release-orchestration.mjs tag
