name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable version tag to release
        required: true
        type: string
      publish_crates:
        description: Publish missing crate versions
        required: true
        default: true
        type: boolean
      bootstrap:
        description: Explicit first-release token mode (0.1.1 only)
        required: true
        default: false
        type: boolean
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
env:
  CARGO_BUILD_JOBS: 1
  CARGO_INCREMENTAL: 0
jobs:
  qualify:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag || github.ref }}
  archives:
    needs: qualify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: "1.99.0"
      - name: Native build prerequisites and ephemeral runner disk
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h .
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: pnpm install --frozen-lockfile --ignore-pnpmfile
      - name: Validate immutable release identity
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          node scripts/release-identity.mjs
          git merge-base --is-ancestor HEAD origin/main
      - name: Build and qualify release bundle
        run: bash scripts/native-qualification.sh release
      - name: Archive with inventory and checksums
        run: node scripts/release-archive.mjs ${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
  crates:
    needs: archives
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: "1.99.0"
      - name: Native build prerequisites and ephemeral runner disk
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h .
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: pnpm install --frozen-lockfile --ignore-pnpmfile
      - name: Validate immutable release identity
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_BOOTSTRAP: ${{ inputs.bootstrap && 'true' || 'false' }}
          RELEASE_EVENT: ${{ github.event_name }}
        run: |
          node scripts/release-identity.mjs
          git merge-base --is-ancestor HEAD origin/main
      - run: pnpm dev:cargo -- package --workspace --exclude lapis-compute --locked
      - id: existing
        run: node scripts/release-registry.mjs --status
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
        if: >-
          steps.existing.outputs.missing != '0' && !inputs.bootstrap &&
          (github.event_name != 'workflow_dispatch' || inputs.publish_crates)
      - name: Publish missing packages using trusted publishing
        if: >-
          steps.existing.outputs.missing != '0' && !inputs.bootstrap &&
          (github.event_name != 'workflow_dispatch' || inputs.publish_crates)
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: node scripts/release-registry.mjs --publish
      - name: Explicit initial namespace bootstrap
        if: >-
          steps.existing.outputs.missing != '0' && inputs.bootstrap &&
          github.event_name == 'workflow_dispatch' && inputs.publish_crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_BOOTSTRAP_TOKEN }}
        run: |
          test -n "$CARGO_REGISTRY_TOKEN"
          node scripts/release-registry.mjs --publish
      - run: node scripts/release-registry.mjs
      - name: Check published executable installation
        run: |
          version=$(node --input-type=module -e 'import {version} from "./scripts/release-version.mjs"; console.log(version())')
          pnpm dev:cargo -- install lapis-acp --version "$version" --locked --root /tmp/lapis-ai-install
          /tmp/lapis-ai-install/bin/lapis-acp --version
  github:
    needs: [archives, crates]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true
      - name: Verify and publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          cat dist/*.sha256 | sort > dist/SHA256SUMS
          (cd dist && sha256sum --check SHA256SUMS)
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Lapis AI $RELEASE_TAG" --notes-file CHANGELOG.md
          fi
          node scripts/release-assets.mjs
          gh release edit "$RELEASE_TAG" --draft=false
