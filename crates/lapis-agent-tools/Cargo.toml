[package]
name = "lapis-agent-tools"
version.workspace = true
edition = "2024"
license = "Apache-2.0"
publish.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "Permissioned workspace coding tools over MCP stdio for Lapis Agent"

[dependencies]
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "process", "time", "signal", "sync"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["signal", "process", "fs"] }
