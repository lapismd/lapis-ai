[package]
name = "lapis-acp-runner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "ACP subprocess ownership, session lifecycle and bounded cancellation"
keywords = ["acp", "agent", "stdio", "json-rpc"]
categories = ["development-tools"]

[dependencies]
lapis-acp-protocol.workspace = true
lapis-acp-agent.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = [
  "io-util",
  "process",
  "rt",
  "sync",
  "time",
] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = [
  "process",
  "signal",
] }

[dev-dependencies]
lapis-acp-testkit = { workspace = true, features = [] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
