[package]
name = "lapis-ai-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "Supervised native ACP, agent and compute clients for Rust applications"

[dependencies]
toml = "0.9"
serde.workspace = true
sha2 = "0.10"
zeroize = "1"
lapis-ai-config.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["signal", "process"] }
[dev-dependencies]
tempfile = "3"
[[example]]
name = "native-session"
path = "examples/native-session.rs"
[[example]]
name = "agent-catalog"
path = "examples/agent-catalog.rs"
[[example]]
name = "native-compute"
path = "examples/native-compute.rs"
