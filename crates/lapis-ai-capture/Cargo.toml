[package]
name = "lapis-ai-capture"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "Bounded read-only discovery and acquisition of external agent sessions"

[dependencies]
serde_json.workspace = true
serde = { workspace = true }
sha2 = { version = "0.10.9", optional = true }
rusqlite = { version = "0.37", features = ["bundled"], optional = true }

[features]
default = []
session-pages = ["dep:sha2"]
opencode-sqlite = ["session-pages", "dep:rusqlite"]

[dev-dependencies]
tempfile = "3"

[[test]]
name = "local_sessions"
required-features = ["opencode-sqlite"]
