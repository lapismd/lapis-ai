[package]
name = "lapis-agent"
version.workspace = true
edition = "2021"
rust-version.workspace = true
license = "Apache-2.0"
publish.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
description = "ACP coding agent with provider adapters, permission gates and MCP tools"
readme = "README.md"
keywords = ["acp", "agent", "llm", "mcp", "minimal"]
categories = ["command-line-utilities", "web-programming"]

[lib]
name = "lapis_agent"
path = "src/lib.rs"

[[bin]]
name = "lapis-agent"
path = "src/main.rs"

# Test-only helper; opt in with the test-support feature.
[[bin]]
name = "fake-mcp"
required-features = ["test-support"]
path = "tests/bin/fake_mcp.rs"

# Test-only lock holder: a real second process that takes the coordinator's
# cross-process advisory lock, so the auth tests can prove genuine
# inter-process single-flight and crash-release rather than same-process
# handles. Tiny; only used by the databricks auth integration tests.
[[bin]]
name = "lock-holder"
required-features = ["test-support"]
path = "tests/bin/lock_holder.rs"

# Test-only auth worker: a real second process that runs the PUBLIC auth
# coordinator API (`acquire_with_intent`) with a scripted browser opener and a
# shared temp cache, so the auth tests can prove the cross-process single-flight
# contract end-to-end — durable cooldown sharing and one-grant/one-cache races
# across a genuine process boundary, not two in-process handles. Only used by
# the databricks auth integration tests.
[[bin]]
name = "auth-worker"
required-features = ["test-support"]
path = "tests/bin/auth_worker.rs"


[dependencies]
lapis-ai-config.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "process", "time", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
serde_yaml = { version = "0.9" }
reqwest = { version = "0.13", features = ["json", "rustls", "form", "query"] }
rmcp = { version = "1", default-features = false, features = ["client", "transport-child-process"] }
arc-swap = "1"
getrandom = "0.4"
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3" }
# OAuth 2.0 PKCE for Databricks (and future browser-auth providers).
async-trait = "0.1"
axum = { version = "0.8" }
base64 = "0.22"
hex = { version = "0.4" }
sha2 = "0.10"
url = "2"
urlencoding = "2"
webbrowser = "1"
dirs = "6"
# Cross-process advisory file lock (flock on Unix, LockFileEx on Windows) for
# the auth coordinator's single-flight. Kept off std's `File::try_lock` so the
# crate stays buildable on the repo's declared 1.88 MSRV (those std APIs are
# 1.89+).
fs2 = "0.4"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["signal", "process"] }

[dev-dependencies]
# Synthetic TLS OAuth/catalog servers exercise the strict HTTPS production path.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio = { version = "1", features = ["test-util", "rt-multi-thread", "macros", "io-std", "io-util", "sync", "process", "time", "net"] }
nix = { version = "0.31", default-features = false, features = ["signal", "process"] }
axum = { version = "0.8" }
hex = { version = "0.4" }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tempfile = "3"

[[test]]
name = "owned_metadata"
path = "tests/owned_metadata.rs"

[[test]]
name = "owned_provider_catalog"
path = "tests/owned_provider_catalog.rs"

[[bin]]
name = "lapis-agent-core-fixture"
required-features = ["test-support"]
path = "tests/bin/agent_core.rs"

[features]
default = []
test-support = []
